<title>Boomlets</title>
<style>
  :root { --ink: #2E2A4A; --soft: #6B6585; --cream: #FFF4E2; --accent: #F2A541; }

  body { margin: 0; background: var(--cream); color: var(--ink); font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  h1 { font-size: 2.4rem; margin: 0; }
  p.tag { color: var(--soft); margin-top: 4px; }
  img { width: 30%; max-width: 200px; border-radius: 12px; margin: 4px; }

<main>
<h1>Boomlets</h1>
